# ============================================================
# e语 · Cloudflare Worker API 配置
# 部署： npm run deploy:api   (即 wrangler deploy)
# 本地： npm run dev:api      (wrangler dev --local，使用本地 D1 模拟)
# ============================================================

name = "eyu-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# 免费计划即可：Workers 10 万请求/天，D1 5GB 存储，KV 10 万读/天
workers_dev = true
preview_urls = true

[observability]
enabled = true

# ------------------------------------------------------------
# 环境变量（非机密）。机密请用： wrangler secret put JWT_SECRET
# ------------------------------------------------------------
[vars]
ENVIRONMENT      = "production"
JWT_ISSUER       = "eyu"
ACCESS_TOKEN_TTL = "604800"          # 7 天（秒）
DEFAULT_TZ       = "Asia/Shanghai"
# 提醒消息里带的站点地址（换域名只改这里）
SITE_URL         = "https://eyu.letsgo.cc.cd"
# 允许跨域的前端来源，逗号分隔
# eyu.letsgo.cc.cd 是自定义域（Pages 上绑的），eyu.pages.dev 是默认域，两个都留着
CORS_ORIGINS     = "https://eyu.letsgo.cc.cd,https://eyu.pages.dev,http://localhost:5173,http://127.0.0.1:5173"

# ------------------------------------------------------------
# D1 · 关系型主库
# 首次创建后，把输出的 database_id 填到下面（或用 npm run setup 自动回填）
#   npx wrangler d1 create eyu-db
# ------------------------------------------------------------
[[d1_databases]]
binding       = "DB"
database_name = "eyu-db"
database_id   = "a5de6486-b5c1-47cd-b636-5036524b2482"

# ------------------------------------------------------------
# KV · JWT Session / 黑名单 / 热数据缓存
#   npx wrangler kv namespace create SESSIONS
# ------------------------------------------------------------
[[kv_namespaces]]
binding    = "SESSIONS"
id         = "0cd26cd68db04753afe1aec6ab4bb011"
preview_id = "0cd26cd68db04753afe1aec6ab4bb011"

# ------------------------------------------------------------
# Workers AI · 智能剪藏（把一段英文拆成单词 / 语块 / 句型卡片）
# 免费额度：每天 10,000 neurons，够几十次剪藏
# ------------------------------------------------------------
[ai]
binding = "AI"

# ------------------------------------------------------------
# Cron Triggers · 每日打卡提醒
# UTC 11:30 = 北京时间 19:30，睡前刷一轮刚合适
# ------------------------------------------------------------
[triggers]
crons = ["30 11 * * *"]

# ------------------------------------------------------------
# 环境隔离：wrangler deploy --env staging
# ------------------------------------------------------------
# [env.staging]
# name = "eyu-api-staging"
# [[env.staging.d1_databases]]
# binding       = "DB"
# database_name = "eyu-db-staging"
# database_id   = "<staging-d1-id>"
