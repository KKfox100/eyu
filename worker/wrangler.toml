# ============================================================
# e语 · Cloudflare Worker API 配置
# 部署： npm run deploy:api   (即 wrangler deploy)
# 本地： npm run dev:api      (wrangler dev --local，使用本地 D1 模拟)
# ============================================================

name = "eyu-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# 免费计划即可：Workers 10 万请求/天，D1 5GB 存储，KV 10 万读/天
workers_dev = true
preview_urls = true

[observability]
enabled = true

# ------------------------------------------------------------
# 环境变量（非机密）。机密请用： wrangler secret put JWT_SECRET
# ------------------------------------------------------------
[vars]
ENVIRONMENT      = "production"
JWT_ISSUER       = "eyu"
ACCESS_TOKEN_TTL = "604800"          # 7 天（秒）
DEFAULT_TZ       = "Asia/Shanghai"
# 允许跨域的前端来源，逗号分隔；部署 Pages 后把正式域名加进来
CORS_ORIGINS     = "http://localhost:5173,http://127.0.0.1:5173"

# ------------------------------------------------------------
# D1 · 关系型主库
# 首次创建后，把输出的 database_id 填到下面（或用 npm run setup 自动回填）
#   npx wrangler d1 create eyu-db
# ------------------------------------------------------------
[[d1_databases]]
binding       = "DB"
database_name = "eyu-db"
database_id   = "00000000-0000-0000-0000-000000000000"

# ------------------------------------------------------------
# KV · JWT Session / 黑名单 / 热数据缓存
#   npx wrangler kv namespace create SESSIONS
# ------------------------------------------------------------
[[kv_namespaces]]
binding    = "SESSIONS"
id         = "00000000000000000000000000000000"
preview_id = "00000000000000000000000000000000"

# ------------------------------------------------------------
# Cron Triggers · Phase 3 开启（每日 23:00 UTC = 次日 07:00 北京时间）
# 开启前需在 src/index.ts 中导出 scheduled() 处理器
# ------------------------------------------------------------
# [triggers]
# crons = ["0 23 * * *"]

# ------------------------------------------------------------
# 环境隔离：wrangler deploy --env staging
# ------------------------------------------------------------
# [env.staging]
# name = "eyu-api-staging"
# [[env.staging.d1_databases]]
# binding       = "DB"
# database_name = "eyu-db-staging"
# database_id   = "<staging-d1-id>"
